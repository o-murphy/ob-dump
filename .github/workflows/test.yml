name: Test all packages

on:
  push:
  pull_request:
  workflow_call:

jobs:
  test-dart:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1

      - run: ./scripts/ci/test-dart.sh
        shell: bash

  # The package's build hook compiles the vendored LMDB source, so the
  # `dart test` above already covers the native build on all three desktop
  # OSes. This job additionally proves the failure mode: with liblmdb removed
  # from a compiled bundle, reading throws a clear LmdbException.
  dart-missing-library:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1

      - run: ./scripts/ci/missing-library-check.sh
        shell: bash

  publish-dry-run:
    name: pub.dev dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1

      # CHANGELOG.md of the package is generated at publish time (see
      # release.yml), pub refuses to publish without one.
      - run: python3 scripts/ci/sync_changelogs.py dart
      - run: dart pub get
        working-directory: dart
      - run: dart pub publish --dry-run
        working-directory: dart

  # dart/example (a Flutter app that depends on ob_dump_reader by path), tested
  # and built for every target the package supports (Android, iOS, Linux, macOS,
  # Windows) plus `flutter test` (the case the build hook exists for: a
  # bundled-library lookup that works the same under `flutter test` as under
  # `dart run`). Each build step then checks the library the hook compiled is in
  # the build output, and runs the built app (Linux, macOS, Windows) -- with
  # the library present it must read a store, with it removed it must fail
  # fast. See scripts/ci/flutter-smoke.sh.
  flutter-smoke:
    name: Flutter ${{ matrix.target }} (${{ matrix.os }})
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: test, os: ubuntu-latest }
          - { target: test, os: macos-latest }
          - { target: test, os: windows-latest }
          - { target: linux, os: ubuntu-latest }
          - { target: macos, os: macos-latest }
          - { target: ios, os: macos-latest }
          - { target: android, os: ubuntu-latest }
          - { target: windows, os: windows-latest }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          pub-cache: true

      - name: Install system deps
        if: matrix.os == 'ubuntu-latest' && (matrix.target == 'test' || matrix.target == 'linux')
        run: |
          sudo apt-get update -q
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev xvfb

      - name: ${{ matrix.target }}
        run: scripts/ci/flutter-smoke.sh ${{ matrix.target }}

  # The Android build above only proves liblmdb.so is inside the APK. This
  # loads it on an emulator and reads a store (example/integration_test).
  android-runtime:
    name: Android emulator (the library loads and reads)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          pub-cache: true

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          script: cd dart/example && flutter pub get && flutter test integration_test

  test-py:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e

      - run: ./scripts/ci/test-python.sh
        shell: bash

  test-js:
    strategy:
      fail-fast: false
      matrix:
        # No windows-latest: the postinstall rebuild (needed to read real
        # ObjectBox databases — see js/README.md) hits an MSVC link error
        # building lmdb's V8 fast-api-calls feature (`LNK2001 unresolved
        # external symbol ... CFunctionInfo`) that neither env vars nor
        # --enable_fast_api_calls=false reliably suppress there; not chasing
        # this further for now, see js/README.md's own Windows note.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: ./scripts/ci/test-js.sh
        shell: bash

  build-cpp:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # -C Release is a no-op on single-config generators (Linux/macOS
      # Makefiles) and required on Windows' multi-config Visual Studio
      # generator.
      - name: Build + test
        shell: bash
        run: ./scripts/ci/build-cpp.sh

      - name: Package
        shell: bash
        run: ./scripts/ci/package-cpp.sh ${{ matrix.os }}

      # Named "ci-build-cpp-*", not "ob-dump-*" — this workflow also runs as
      # a workflow_call from release.yml, sharing that run's artifact
      # namespace with the release's own, version-stamped build-cpp job;
      # release.yml's create-release step downloads everything matching
      # "ob-dump-*" to attach to the GitHub Release, so this smoke-test
      # build must not collide with that pattern.
      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ci-build-cpp-${{ matrix.os }}
          path: ob-dump-${{ matrix.os }}.tar.gz
